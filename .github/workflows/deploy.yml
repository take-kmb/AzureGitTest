name: Deploy to Azure APP Service

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

  steps:
    - name: リポジトリを取得
      uses: actions/checkout@v4

    - name: App Serviceに公開
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'ia12a04gittest'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: .